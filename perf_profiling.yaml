defaults:
  - data: zarr
  - dataloader: native_grid
  - diagnostics: evaluation
  - system: example
  - graph: multi_scale
  - model: graphtransformer
  - task: forecaster
  - training: single
  - _self_

config_validation: True

system:
  hardware:
    num_gpus_per_node: 1
    num_nodes: 1
    num_gpus_per_model: 1
  input:
    # Set ANEMOI_DATASET_PATH to the folder that contains the datasets.
    dataset: ${oc.env:ANEMOI_DATASET_PATH}/aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr
    graph: ./graphs/o96_multiscale_graph.pt
  output:
    root: ./outputs/default

graph:
  overwrite: False

dataloader:
  num_workers:
    training: 2
    validation: 2
  batch_size:
    training: 1
    validation: 1
  limit_batches:
    training: 20
    validation: 2
  training:
    datasets:
      data:
        start: 2020
        end: 2020

model:
  compile: []

training:
  max_epochs: 1
  num_sanity_val_steps: 0

diagnostics:
  callbacks: []
  plot:
    callbacks: []
  enable_checkpointing: False
  print_memory_summary: False
  log:
    mlflow:
      enabled: False
      offline: True
      tracking_uri: ""
  benchmark_profiler:
    memory:
      enabled: True
      steps: 2
      warmup: 2
    time:
      enabled: True
      verbose: False
    speed:
      enabled: True
    system:
      enabled: False
    model_summary:
      enabled: False
    snapshot:
      enabled: True
      steps: 2
      warmup: 2
